name: Release (DISABLED — not the publishing authority)

# ---------------------------------------------------------------------------
# THIS REPOSITORY CANNOT PUBLISH, BY CONSTRUCTION.
#
# Publish authority for @workspacejson/spec and @workspacejson/rules still
# belongs to workspace-json/agents-audit, which holds the NPM_TOKEN secret.
# Transferring that authority is META-243, and it has not happened.
#
# Four independent things keep this workflow non-authoritative:
#
#   1. No trigger.        There is no runnable `on:` event. GitHub cannot start
#                         this workflow — not on push, not on tag, not by
#                         manual dispatch.
#   2. No publish step.   There is deliberately no `changeset publish`, no
#                         `npm publish`, and no `pnpm publish` anywhere below.
#   3. No credential.     workspacejson/standard has an empty secret list and
#                         an empty variable list. NPM_TOKEN does not exist here.
#   4. Read-only token.   `permissions: contents: read`.
#
# scripts/check-architecture.mjs enforces 1-3 in CI and fails the build if a
# publish trigger, a publish step, or a foreign-package publish is reintroduced.
#
# When META-243 executes, it must ALSO revoke the old repository's authority in
# the same change. Two repositories publishing the same package is the specific
# failure this file exists to prevent.
# ---------------------------------------------------------------------------

on: {}

permissions:
  contents: read

jobs:
  placeholder:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: This workflow is intentionally incapable of publishing
        run: |
          echo "Publish authority for standard-owned packages has not been transferred."
          echo "See META-243. This job never runs."
          exit 1
