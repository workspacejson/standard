name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Architecture and clean-room guards run FIRST: a boundary violation
      # should fail before anything else has a chance to look green.
      - name: Architecture and clean-room guards
        run: pnpm run check:architecture

      - name: Architecture guard red tests
        run: pnpm run check:architecture:test

      # Build precedes typecheck deliberately. @workspacejson/rules typechecks
      # against @workspacejson/spec's EMITTED declarations, which `tsc --noEmit`
      # never produces. In the source monorepo this ordering was hidden by a
      # hand-written ambient `declare module '@workspacejson/spec'`; removing
      # that stub (META-239 Phase 3) made the real dependency visible.
      - name: Build all packages
        run: pnpm -r build

      - name: Typecheck all packages
        run: pnpm -r typecheck

      - name: Run tests
        run: pnpm -r test

      - name: Verify package tarballs
        run: pnpm run release:verify-packs

      # Standard owns the normative schema. These two gates prove the package
      # ships the canonical bytes and that every shipped example validates
      # against them. See META-211.
      - name: Verify schema provenance
        run: pnpm run check:schema

      - name: Validate shipped examples against the package schema
        run: pnpm run check:examples

      # Only packages this repository publishes are verified here.
      # agents-audit belongs to workspacejson/cli and is deliberately absent.
      - name: Validate package exports
        run: |
          node -e "import('@workspacejson/spec')"
          node -e "import('@workspacejson/spec/schema', { with: { type: 'json' } }).catch(() => import('@workspacejson/spec/schema'))"
          node -e "import('@workspacejson/rules')"
          node -e "import('@workspacejson/rules/testing')"

      - name: Verify the spec binary
        run: node packages/spec/dist/cli.js --help
