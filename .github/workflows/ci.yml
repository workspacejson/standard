name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. This workflow only reads the repository — it does
# not comment, label, publish or write any artifact. Any job needing more must
# raise it at the job level with a reason, not here.
permissions:
  contents: read

# A superseded push to the same branch has nothing left to prove. `main` is
# excluded from cancellation so the record of what landed stays complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Architecture and clean-room guards run FIRST: a boundary violation
      # should fail before anything else has a chance to look green.
      - name: Architecture and clean-room guards
        run: pnpm run check:architecture

      - name: Architecture guard red tests
        run: pnpm run check:architecture:test

      # Documentation decays silently. This proves every relative link still
      # resolves, that no internal tracker identifier reached public prose, and
      # that every documented `pnpm run` command actually exists. External links
      # are syntax-checked only — fetching them in CI fails on someone else's
      # outage and trains everyone to ignore red.
      - name: Documentation integrity
        run: pnpm run check:docs

      # Build precedes typecheck deliberately. @workspacejson/rules typechecks
      # against @workspacejson/spec's EMITTED declarations, which `tsc --noEmit`
      # never produces. In the source monorepo this ordering was hidden by a
      # hand-written ambient `declare module '@workspacejson/spec'`; removing
      # that stub during the extraction made the real dependency visible.
      - name: Build all packages
        run: pnpm -r build

      - name: Typecheck all packages
        run: pnpm -r typecheck

      - name: Run tests
        run: pnpm -r test

      - name: Verify package tarballs
        run: pnpm run release:verify-packs

      # Standard owns the normative schema. These two gates prove the package
      # ships the canonical bytes and that every shipped example validates
      # against them.
      - name: Verify schema provenance
        run: pnpm run check:schema

      - name: Validate shipped examples against the package schema
        run: pnpm run check:examples

      # Only packages this repository publishes are verified here.
      # agents-audit belongs to workspacejson/cli and is deliberately absent.
      #
      # `@workspacejson/rules/testing` re-exports vitest helpers, and vitest
      # throws "failed to access its internal state" when evaluated outside a
      # vitest run. So its export map is verified by RESOLUTION, not by
      # evaluation; its runtime behavior is covered by the package's own vitest
      # suite (src/testing/__tests__/rule-tester.test.ts) and by the migration
      # parity harness, which drives RuleTester inside a real vitest process.
      - name: Validate package exports
        run: |
          node -e "import('@workspacejson/spec')"
          node -e "import('@workspacejson/spec/schema', { with: { type: 'json' } }).catch(() => import('@workspacejson/spec/schema'))"
          node -e "import('@workspacejson/rules')"
          node --input-type=module -e "
            const u = import.meta.resolve('@workspacejson/rules/testing');
            if (!u.endsWith('/dist/testing/rule-tester.js')) {
              throw new Error('unexpected ./testing resolution: ' + u);
            }
            console.log('@workspacejson/rules/testing resolves to ' + u);
          "

      # The binary's only command is `validate <file>`. It has no --help flag and
      # exits 1 with usage for any other form, so both paths are asserted
      # explicitly rather than assuming a conventional --help exists.
      - name: Verify the spec binary
        run: |
          node packages/spec/dist/cli.js validate packages/spec/examples/populated-v0.4.json
          if node packages/spec/dist/cli.js; then
            echo "spec binary should exit non-zero when invoked without a command"
            exit 1
          fi
