name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. This workflow only reads the repository — it does
# not comment, label, publish or write any artifact. Any job needing more must
# raise it at the job level with a reason, not here.
permissions:
  contents: read

# A superseded push to the same branch has nothing left to prove. `main` is
# excluded from cancellation so the record of what landed stays complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      # Full history. The ADR revision index resolves each record's published
      # commit by walking the baseline branch for the commit whose blob matches
      # the record's bytes. A shallow clone has no such history, so the check
      # would silently report every record as unpublished.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Architecture and clean-room guards run FIRST: a boundary violation
      # should fail before anything else has a chance to look green.
      - name: Architecture and clean-room guards
        run: pnpm run check:architecture

      - name: Architecture guard red tests
        run: pnpm run check:architecture:test

      # Documentation decays silently. This proves every relative link still
      # resolves, that no internal tracker identifier reached public prose, and
      # that every documented `pnpm run` command actually exists. External links
      # are syntax-checked only — fetching them in CI fails on someone else's
      # outage and trains everyone to ignore red.
      - name: Documentation integrity
        run: pnpm run check:docs

      # An Accepted ADR must not depend on a value nobody filled in. This proves
      # the generated revision index still matches the records on disk, and that
      # no accepted record carries an unresolved `filled at merge` placeholder.
      - name: ADR revision index
        run: pnpm run check:adr

      - name: ADR revision index red tests
        run: pnpm run check:adr:test

      # Build precedes typecheck deliberately. @workspacejson/rules typechecks
      # against @workspacejson/spec's EMITTED declarations, which `tsc --noEmit`
      # never produces. In the source monorepo this ordering was hidden by a
      # hand-written ambient `declare module '@workspacejson/spec'`; removing
      # that stub during the extraction made the real dependency visible.
      - name: Build all packages
        run: pnpm -r build

      - name: Typecheck all packages
        run: pnpm -r typecheck

      - name: Run tests
        run: pnpm -r test

      - name: Verify package tarballs
        run: pnpm run release:verify-packs

      # Standard owns the normative schema. These two gates prove the package
      # ships the canonical bytes and that every shipped example validates
      # against them.
      - name: Verify schema provenance
        run: pnpm run check:schema

      - name: Validate shipped examples against the package schema
        run: pnpm run check:examples

      # ADR-006's normative path-identity corpus: structure, coverage, and that
      # every delegated case carries a portable fixture. Also re-runs the frozen
      # historical witness and fails if it stops reproducing the committed
      # receipt, which would mean the specimen no longer reflects the revisions
      # it is pinned to. It does NOT observe the consumer repositories — they
      # run this corpus against their own implementations.
      - name: Verify the path-identity corpus and its watched-red receipt
        run: pnpm run check:corpus

      # Source tests prove the logic; they do not prove a consumer receives it.
      # `files`, the exports map and the emitted declarations all sit between
      # src/ and an installed package. This packs, installs and imports the
      # tarball, then runs the corpus through the exports that actually ship —
      # every vector through `validateStoredKey`, and every vector again through
      # `inspectStoredKeys` embedded on all four ratified path-bearing surfaces.
      - name: Prove validateStoredKey and inspectStoredKeys from the packed artifact
        run: pnpm run check:packed

      # Only packages this repository publishes are verified here.
      # agents-audit belongs to workspacejson/cli and is deliberately absent.
      #
      # `@workspacejson/rules/testing` re-exports vitest helpers, and vitest
      # throws "failed to access its internal state" when evaluated outside a
      # vitest run. So its export map is verified by RESOLUTION, not by
      # evaluation; its runtime behavior is covered by the package's own vitest
      # suite (src/testing/__tests__/rule-tester.test.ts) and by the migration
      # parity harness, which drives RuleTester inside a real vitest process.
      - name: Validate package exports
        run: |
          node -e "import('@workspacejson/spec')"
          node -e "import('@workspacejson/spec/schema', { with: { type: 'json' } }).catch(() => import('@workspacejson/spec/schema'))"
          node -e "import('@workspacejson/rules')"
          node --input-type=module -e "
            const u = import.meta.resolve('@workspacejson/rules/testing');
            if (!u.endsWith('/dist/testing/rule-tester.js')) {
              throw new Error('unexpected ./testing resolution: ' + u);
            }
            console.log('@workspacejson/rules/testing resolves to ' + u);
          "

      # The binary's only command is `validate <file>`. It has no --help flag and
      # exits 1 with usage for any other form, so both paths are asserted
      # explicitly rather than assuming a conventional --help exists.
      - name: Verify the spec binary
        run: |
          node packages/spec/dist/cli.js validate packages/spec/examples/populated-v0.4.json
          if node packages/spec/dist/cli.js; then
            echo "spec binary should exit non-zero when invoked without a command"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Four-path producer conformance.
  #
  # This repository owns the neutral contract; the producer under test lives in
  # workspacejson/cli. The suite therefore needs a CLI candidate, which is why
  # this is a separate job: it checks out a second repository and builds it,
  # which the unit-test matrix should not pay for, and it does not need the
  # Node matrix.
  #
  # The suite does NOT skip when the candidate is missing — it exits non-zero
  # with instructions. A conformance gate that goes green because it could not
  # find the implementation reports conformance it never measured.
  #
  # workspacejson/cli is public, so the checkout needs no token and no secret.
  # The job therefore runs on forks and on first-time contributors' pull
  # requests, which a secret-dependent gate could not.
  #
  # It tracks the producer's `main` rather than a pinned SHA on purpose: the
  # point of a conformance gate is to notice when the implementation drifts
  # from the contract. A pin would only ever re-prove a known-good pairing.
  # ---------------------------------------------------------------------------
  producer-conformance:
    name: Four-path producer conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the standard
        uses: actions/checkout@v7

      - name: Check out the producer under test
        uses: actions/checkout@v7
        with:
          repository: workspacejson/cli
          ref: main
          path: .candidate

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install and build the standard
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @workspacejson/spec build

      - name: Build the producer candidate
        working-directory: .candidate
        run: |
          pnpm install --no-frozen-lockfile
          pnpm -r build

      # Green: the candidate satisfies the contract.
      - name: Producer conformance
        env:
          WORKSPACEJSON_CLI_CANDIDATE: ${{ github.workspace }}/.candidate/packages/cli
        run: pnpm run check:conformance

      # Red: each protected behavior, when broken, makes the suite fail. Runs
      # after the green gate so the receipts appear in that order in the log.
      - name: Producer conformance red tests
        env:
          WORKSPACEJSON_CLI_CANDIDATE: ${{ github.workspace }}/.candidate/packages/cli
        run: pnpm run check:conformance:test
